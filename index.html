<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chronicle Minimal</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #4e89ae;
            --success: #4ea870;
            --text-main: #e1e1e6;
            --text-muted: #9a9aa2;
            --border: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- OBERE LEISTE: RESSOURCEN & UHR --- */
        header {
            background-color: var(--card-bg);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .res-group {
            display: flex;
            gap: 10px;
        }

        .res-box {
            background: #16161b;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .res-box span {
            color: var(--accent);
        }

        #clock-display {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-size: 0.95rem;
        }

        /* --- HAUPTBEREICH --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            flex-shrink: 0; /* verhindert Zusammendrücken im Flex-Container */
        }

        /* --- BUTTONS --- */
        .action-btn {
            display: block;
            width: 100%;
            background-color: #272730;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            color: var(--text-main);
            text-align: left;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.06s, background-color 0.15s;
        }

        .action-btn:last-child {
            margin-bottom: 0;
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.97);
            background-color: #32323e;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .btn-reward {
            color: var(--success);
            font-size: 0.95rem;
        }

        .btn-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn-cost {
            display: block;
            font-weight: bold;
        }

        /* --- SHOP --- */
        [hidden] {
            display: none !important; /* sonst überschreibt display:block das hidden-Attribut */
        }

        .card-title {
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        #shop-items, .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #shop-items .action-btn, .btn-list .action-btn {
            margin-bottom: 0;
        }

        .btn-price {
            color: #d6b04e;
            font-size: 0.95rem;
        }

        /* --- TABS / MENÜS --- */
        .tab-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #tabbar {
            display: flex;
            flex-shrink: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            min-height: 54px;
            padding: 8px 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--accent);
            box-shadow: inset 0 2px 0 var(--accent);
        }

        .action-btn.running {
            border-color: var(--success);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-row span:first-child {
            color: var(--text-muted);
        }

        .res-group { flex-wrap: wrap; gap: 6px; }
        .res-box { padding: 5px 9px; font-size: 0.85rem; }

        /* --- DEZENTE STATUS-ZEILE UNTEN --- */
        footer {
            padding: 10px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="res-group" id="resource-bar"></div>
        <div id="clock-display">00:00:00</div>
    </header>

    <main>
        <div class="tab-panel" id="tab-actions">
            <section class="card" id="actions-container"></section>

            <section class="card" id="shop-card" hidden>
                <h2 class="card-title">Shop</h2>
                <div id="shop-items"></div>
            </section>
        </div>

        <div class="tab-panel" id="tab-loop" hidden>
            <section class="card">
                <h2 class="card-title">Loop-Aktionen</h2>
                <div class="btn-list" id="loop-list"></div>
            </section>
        </div>

        <div class="tab-panel" id="tab-training" hidden>
            <section class="card">
                <h2 class="card-title">Training</h2>
                <div class="btn-list" id="training-list"></div>
            </section>
        </div>

        <div class="tab-panel" id="tab-upgrades" hidden>
            <section class="card">
                <h2 class="card-title">Upgrades</h2>
                <div class="btn-list" id="upgrade-list"></div>
            </section>
        </div>

        <div class="tab-panel" id="tab-stats" hidden>
            <section class="card">
                <h2 class="card-title">Stats</h2>
                <div id="stats-list"></div>
            </section>
        </div>
    </main>

    <footer id="save-status">Autosave aktiv</footer>

    <nav id="tabbar">
        <button type="button" class="tab-btn active" data-tab="actions">Aktionen</button>
        <button type="button" class="tab-btn" data-tab="loop">Loop</button>
        <button type="button" class="tab-btn" data-tab="training">Training</button>
        <button type="button" class="tab-btn" data-tab="upgrades">Upgrades</button>
        <button type="button" class="tab-btn" data-tab="stats">Stats</button>
    </nav>

    <script>
        /* =================================================================
           1. KONFIGURATION (EINFACH ERWEITERBAR)
           regenPerSec: Regeneration pro Sekunde (optional, nur sinnvoll mit hasMax)
           ================================================================= */
        const RESOURCE_CONFIG = {
            health: { name: "Gesundheit", hasMax: true, start: 10, max: 10 },
            energy: { name: "Energie", hasMax: true,  start: 10, max: 10, regenPerSec:1 }, // 1 Energie / 5 Sek.
            money:  { name: "Gold",    hasMax: true,  start: 0,  max: 20 }
        };

        const ACTION_CONFIG = [
            {
                id: "beg",
                name: "Betteln",
                desc: "Bitte Passanten um eine kleine Münze.",
                cost:   { energy: 2 },
                reward: { money: 1 },
                bonus:  { money: "begBonus" } // zusätzlich itemBonus("begBonus")
            }
        ];

        // unlock: Gold-Stand, ab dem der Gegenstand im Shop erscheint (bleibt danach dauerhaft sichtbar)
        // maxOwned: maximale Anzahl, die man besitzen kann (null = unbegrenzt)
        // effects: dauerhafte Boni, die mit itemBonus(name) abgefragt werden
        const ITEM_CONFIG = [
            {
                id: "purse",
                name: "Geldbörse",
                desc: "+30 max. Gold",
                unlock: { money: 10 },
                cost:   { money: 5 },
                maxOwned: 1,
                effects: { maxMoney: 30 }
            },
            {
                id: "pants",
                name: "Zerrissene Hose",
                desc: "+1 Gold beim Betteln",
                unlock: { money: 7 },
                cost:   { money: 7 },
                maxOwned: 1,
                effects: { begBonus: 1 }
            },
            {
                id: "woodstaff",
                name: "Holzstab",
                desc: "+1 Angriff",
                unlock: { money: 20 },
                cost:   { money: 10 },
                maxOwned: 1,
                effects: { atk: 1 }
            },
            {
                id: "blanket",
                name: "Wolldecke",
                desc: "Schlafen: +0,5 Gesundheit/Sek. zusätzlich",
                unlock: { money: 25 },
                cost:   { money: 15 },
                maxOwned: 1,
                effects: { sleepBonus: 0.5 }
            }
        ];

        /* ---- Grundwerte ---- */
        const BASE_ACTION_POINTS = 1;      // so viele Aktivitäten laufen gleichzeitig
        const MEDITATION_BASE_MULT = 1.05; // Regenerations-Multiplikator der Meditation
        const MIND_UPGRADE_FACTOR = 1.10;  // "Geist trainieren": Multiplikator x1,10 pro Level

        const fmt = (n, digits = 2) => n.toLocaleString('de-DE', { maximumFractionDigits: digits });

        // Aktivitäten laufen, bis man sie stoppt (belegen 1 Aktionspunkt)
        // tab: "loop" | "training"; drain: Verbrauch pro Sekunde; xpPerSec/xpPerLevel: Trainingsfortschritt
        // gain: Zuwachs pro Sekunde (Funktion); levelBonus: pro Level +X auf das Maximum der Ressource
        // huntChance: Chance pro Sekunde auf 1x Essen
        const ACTIVITY_CONFIG = [
            {
                id: "meditation",
                tab: "loop",
                name: "Meditation",
                desc: "Vervielfacht die Energie-Regeneration, solange sie läuft.",
                info: () => `Regeneration x${fmt(meditationMult(), 3)}`
            },
            {
                id: "sleep",
                tab: "loop",
                name: "Schlafen",
                desc: "Erholt die Gesundheit.",
                gain: () => ({ health: 1 + itemBonus("sleepBonus") }),
                info: () => `+${fmt(1 + itemBonus("sleepBonus"))} Gesundheit/Sek.`
            },
            {
                id: "fullbody",
                tab: "training",
                name: "Ganzkörpertraining",
                desc: "Jedes Level: +1 max. Gesundheit und +1 max. Energie.",
                drain: { energy: 0.5 },
                xpPerSec: 1,
                xpPerLevel: 20,
                levelBonus: { health: 1, energy: 1 },
                info: () => {
                    const p = state.progress.fullbody;
                    return `Level ${p.level} · ${Math.floor(p.xp)}/20 XP · -0,5 Energie/Sek.`;
                }
            },
            {
                id: "hunt",
                tab: "training",
                name: "Jagen",
                desc: "Mit 20 % Chance pro Sekunde gibt es Essen.",
                drain: { health: 1, energy: 1 },
                huntChance: 0.2,
                info: () => `-1 Gesundheit/Sek. · -1 Energie/Sek. · Essen: ${state.food}`
            }
        ];

        // baseCost wächst pro Level um costFactor
        const UPGRADE_CONFIG = [
            {
                id: "mind",
                name: "Geist trainieren",
                desc: "Erhöht den Multiplikator der Meditation um 10 %.",
                baseCost: { money: 10 },
                costFactor: 1.5,
                info: () => `Level ${upgradeLevel("mind")} · Meditation x${fmt(meditationMult(), 3)} → x${fmt(meditationMult() * MIND_UPGRADE_FACTOR, 3)}`
            }
        ];

        // Stats-Liste: einfach weitere Einträge ergänzen
        const STAT_CONFIG = [
            { label: "Gesundheit",           get: () => `${Math.floor(state.resources.health.current + 1e-9)}/${resMax("health")}` },
            { label: "Aktionspunkte",        get: () => `${state.active.length}/${apTotal()} belegt` },
            { label: "Energie",              get: () => `${Math.floor(state.resources.energy.current + 1e-9)}/${resMax("energy")}` },
            { label: "Energie-Regeneration", get: () => `${fmt(RESOURCE_CONFIG.energy.regenPerSec * regenMult())}/Sek.` },
            { label: "Gold",                 get: () => `${Math.floor(state.resources.money.current + 1e-9)}/${resMax("money")}` },
            { label: "Meditations-Multiplikator", get: () => `x${fmt(meditationMult(), 3)}` },
            { label: "Ganzkörper-Level",     get: () => `${state.progress.fullbody.level}` },
            { label: "Angriff",              get: () => `${itemBonus("atk")}` },
            { label: "Essen",                get: () => `${state.food}` }
        ];

        /* =================================================================
           2. SPIELZUSTAND
           ================================================================= */
        const SAVE_KEY = "chronicle_minimal_v1";
        const SAVE_VERSION = 1;
        const AUTOSAVE_MS = 10000;

        let state = { resources: {} };
        let lastTick = Date.now();
        let storageOk = true;

        function initDefaultState() {
            state.resources = {};
            state.unlocked = [];   // IDs der freigeschalteten Shop-Items
            state.inventory = {};  // Item-ID -> Anzahl
            state.active = [];     // laufende Aktivitäten (wird nicht gespeichert)
            state.upgrades = {};   // Upgrade-ID -> Level
            state.progress = {};   // Aktivität-ID -> { level, xp }
            state.food = 0;        // Beute vom Jagen
            state.timers = {};     // Sekunden-Zähler für Drops (nicht gespeichert)
            for (const u of UPGRADE_CONFIG) state.upgrades[u.id] = 0;
            for (const a of ACTIVITY_CONFIG) {
                if (a.xpPerLevel) state.progress[a.id] = { level: 0, xp: 0 };
            }
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                state.resources[key] = { current: cfg.start };
            }
        }

        function clampRes(key, value) {
            const cfg = RESOURCE_CONFIG[key];
            const v = Math.max(0, value);
            return cfg.hasMax ? Math.min(resMax(key), v) : v;
        }

        /* =================================================================
           3. SPIELLOGIK
           ================================================================= */
        function canAfford(costObj) {
            for (const [resKey, amount] of Object.entries(costObj || {})) {
                const res = state.resources[resKey];
                if (!res || res.current < amount) return false;
            }
            return true;
        }

        // Regeneration für eine vergangene Zeitspanne (Sekunden) anwenden
        function regenerate(seconds, mult = 1) {
            if (!(seconds > 0)) return;
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                if (cfg.regenPerSec > 0) {
                    const res = state.resources[key];
                    res.current = clampRes(key, res.current + cfg.regenPerSec * seconds * mult);
                }
            }
        }

        // Zeitbasiert statt zählerbasiert: bleibt korrekt, auch wenn der Tab gedrosselt wird
        function tick() {
            const now = Date.now();
            const dt = Math.max(0, (now - lastTick) / 1000);
            lastTick = now;
            if (!(dt > 0)) return;

            regenerate(dt, regenMult());
            for (const id of [...state.active]) {
                const activity = activityById(id);
                if (activity) runActivity(activity, dt);
            }
        }

        function executeAction(actionId) {
            const action = ACTION_CONFIG.find(a => a.id === actionId);
            if (!action) return;

            tick(); // Regeneration bis jetzt berücksichtigen
            const cost = action.cost || {};
            const reward = rewardOf(action);

            if (!canAfford(cost)) { updateUI(); return; }

            // Konfigurationsfehler abfangen, bevor etwas abgezogen wird
            for (const resKey of Object.keys(reward)) {
                if (!state.resources[resKey]) {
                    console.error(`Aktion "${action.id}": unbekannte Belohnungs-Ressource "${resKey}"`);
                    return;
                }
            }

            for (const [resKey, amount] of Object.entries(cost)) {
                state.resources[resKey].current -= amount;
            }
            for (const [resKey, amount] of Object.entries(reward)) {
                const res = state.resources[resKey];
                res.current = clampRes(resKey, res.current + amount);
            }

            checkUnlocks();
            updateUI();
            saveGame(); // sofort speichern, nicht erst beim nächsten Intervall
        }

        /* ---- Shop ---- */
        // Schaltet Items frei, deren Gold-Schwelle erreicht wurde (bleibt dauerhaft freigeschaltet)
        function checkUnlocks() {
            for (const item of ITEM_CONFIG) {
                if (!state.unlocked.includes(item.id) && canAfford(item.unlock)) {
                    state.unlocked.push(item.id);
                }
            }
        }

        function ownedCount(item) {
            return state.inventory[item.id] || 0;
        }

        function isMaxed(item) {
            return item.maxOwned != null && ownedCount(item) >= item.maxOwned;
        }

        function buyItem(itemId) {
            const item = ITEM_CONFIG.find(i => i.id === itemId);
            if (!item || !state.unlocked.includes(item.id)) return;

            tick();
            if (isMaxed(item) || !canAfford(item.cost)) { updateUI(); return; }

            for (const [resKey, amount] of Object.entries(item.cost)) {
                state.resources[resKey].current -= amount;
            }
            state.inventory[item.id] = ownedCount(item) + 1;

            updateUI();
            saveGame();
        }

        /* ---- Boni & dynamische Maxima ---- */
        function itemBonus(name) {
            let total = 0;
            for (const item of ITEM_CONFIG) {
                total += ownedCount(item) * ((item.effects && item.effects[name]) || 0);
            }
            return total;
        }

        function resMax(key) {
            const cfg = RESOURCE_CONFIG[key];
            if (!cfg.hasMax) return Infinity;
            let max = cfg.max;
            for (const a of ACTIVITY_CONFIG) {
                if (a.levelBonus && a.levelBonus[key]) max += state.progress[a.id].level * a.levelBonus[key];
            }
            if (key === "money") max += itemBonus("maxMoney");
            return max;
        }

        function clampAll() {
            for (const key of Object.keys(RESOURCE_CONFIG)) {
                state.resources[key].current = clampRes(key, state.resources[key].current);
            }
        }

        function rewardOf(action) {
            const out = {};
            for (const [key, amount] of Object.entries(action.reward || {})) {
                const bonusName = action.bonus && action.bonus[key];
                out[key] = amount + (bonusName ? itemBonus(bonusName) : 0);
            }
            return out;
        }

        /* ---- Aktivitäten (Loop & Training) ---- */
        function activityById(id) { return ACTIVITY_CONFIG.find(a => a.id === id); }
        function isActive(id) { return state.active.includes(id); }
        function apTotal() { return BASE_ACTION_POINTS; }
        function upgradeLevel(id) { return state.upgrades[id] || 0; }
        function maxHealth() { return resMax("health"); }

        function meditationMult() {
            return MEDITATION_BASE_MULT * Math.pow(MIND_UPGRADE_FACTOR, upgradeLevel("mind"));
        }

        function regenMult() {
            return isActive("meditation") ? meditationMult() : 1;
        }

        function stopActivity(id) {
            state.active = state.active.filter(x => x !== id);
        }

        // Loop und Training sind immer klickbar: Starten beendet die jeweils andere Gruppe
        function toggleActivity(id) {
            const activity = activityById(id);
            if (!activity) return;
            tick();
            if (isActive(id)) {
                stopActivity(id);
            } else if (!canAfford(activity.drain || {})) {
                setStatus("Nicht genug Ressourcen für " + activity.name);
            } else {
                state.active = state.active.filter(x => activityById(x).tab === activity.tab);
                while (state.active.length >= apTotal()) state.active.shift();
                state.active.push(id);
            }
            updateUI();
        }

        // Verbrauch, Zuwachs & Fortschritt für dt Sekunden; stoppt automatisch, wenn eine Ressource leer ist
        function runActivity(activity, dt) {
            let secs = dt;
            for (const [key, perSec] of Object.entries(activity.drain || {})) {
                secs = Math.min(secs, state.resources[key].current / perSec);
            }
            if (secs > 0) {
                for (const [key, perSec] of Object.entries(activity.drain || {})) {
                    state.resources[key].current = Math.max(0, state.resources[key].current - perSec * secs);
                }
                const gain = activity.gain ? activity.gain() : {};
                for (const [key, perSec] of Object.entries(gain)) {
                    state.resources[key].current = clampRes(key, state.resources[key].current + perSec * secs);
                }
                if (activity.xpPerSec) {
                    const p = state.progress[activity.id];
                    p.xp += activity.xpPerSec * secs;
                    while (p.xp >= activity.xpPerLevel) {
                        p.xp -= activity.xpPerLevel;
                        p.level++;
                    }
                }
                if (activity.huntChance) {
                    state.timers[activity.id] = (state.timers[activity.id] || 0) + secs;
                    while (state.timers[activity.id] >= 1) {
                        state.timers[activity.id] -= 1;
                        if (Math.random() < activity.huntChance) state.food++;
                    }
                }
            }
            if (secs < dt - 1e-9) stopActivity(activity.id);
        }

        /* ---- Upgrades ---- */
        function upgradeCost(upgrade) {
            const level = upgradeLevel(upgrade.id);
            const cost = {};
            for (const [key, base] of Object.entries(upgrade.baseCost)) {
                cost[key] = Math.ceil(base * Math.pow(upgrade.costFactor, level));
            }
            return cost;
        }

        function buyUpgrade(upgradeId) {
            const upgrade = UPGRADE_CONFIG.find(u => u.id === upgradeId);
            if (!upgrade) return;
            tick();
            const cost = upgradeCost(upgrade);
            if (!canAfford(cost)) { updateUI(); return; }
            for (const [key, amount] of Object.entries(cost)) {
                state.resources[key].current -= amount;
            }
            state.upgrades[upgrade.id] = upgradeLevel(upgrade.id) + 1;
            updateUI();
            saveGame();
        }

        /* =================================================================
           4. UI & UHR
           (Elemente werden einmal gebaut und danach nur noch aktualisiert)
           ================================================================= */
        const ui = { res: {}, buttons: {}, rewardSpans: {} };

        function formatResMap(resMap, prefix = "") {
            return Object.entries(resMap || {}).map(([key, val]) => {
                const name = RESOURCE_CONFIG[key] ? RESOURCE_CONFIG[key].name : key;
                return `${prefix}${val} ${name}`;
            }).join(", ");
        }

        function setText(el, text) {
            if (el.textContent !== text) el.textContent = text;
        }

        function buildUI() {
            // Ressourcen-Anzeige oben
            const resBar = document.getElementById('resource-bar');
            resBar.textContent = "";
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                const box = document.createElement('div');
                box.className = 'res-box';
                box.appendChild(document.createTextNode(`${cfg.name}: `));
                const valueSpan = document.createElement('span');
                box.appendChild(valueSpan);
                resBar.appendChild(box);
                ui.res[key] = valueSpan;
            }

            // Aktions-Buttons
            const actContainer = document.getElementById('actions-container');
            actContainer.textContent = "";
            for (const action of ACTION_CONFIG) {
                const costKeys = Object.keys(action.cost || {});
                const costText = costKeys.length > 0 ? `Kosten: ${formatResMap(action.cost)}` : "Kostenlos";

                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.type = 'button';
                btn.addEventListener('click', () => executeAction(action.id));

                const header = document.createElement('div');
                header.className = 'btn-header';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = action.name;
                const rewardSpan = document.createElement('span');
                rewardSpan.className = 'btn-reward';
                rewardSpan.textContent = formatResMap(action.reward, "+");
                ui.rewardSpans[action.id] = rewardSpan;
                header.append(nameSpan, rewardSpan);

                const desc = document.createElement('div');
                desc.className = 'btn-desc';
                desc.appendChild(document.createTextNode(action.desc));
                const costSpan = document.createElement('span');
                costSpan.className = 'btn-cost';
                costSpan.textContent = costText;
                desc.appendChild(costSpan);

                btn.append(header, desc);
                actContainer.appendChild(btn);
                ui.buttons[action.id] = btn;
            }

            // Shop (Karte bleibt versteckt, bis das erste Item freigeschaltet ist)
            ui.shopCard = document.getElementById('shop-card');
            ui.items = {};
            const shopContainer = document.getElementById('shop-items');
            shopContainer.textContent = "";
            for (const item of ITEM_CONFIG) {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.type = 'button';
                btn.hidden = true;
                btn.addEventListener('click', () => buyItem(item.id));

                const header = document.createElement('div');
                header.className = 'btn-header';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                const priceSpan = document.createElement('span');
                priceSpan.className = 'btn-price';
                header.append(nameSpan, priceSpan);

                const desc = document.createElement('div');
                desc.className = 'btn-desc';
                desc.appendChild(document.createTextNode(item.desc));
                const ownedSpan = document.createElement('span');
                ownedSpan.className = 'btn-cost';
                desc.appendChild(ownedSpan);

                btn.append(header, desc);
                shopContainer.appendChild(btn);
                ui.items[item.id] = { btn, price: priceSpan, owned: ownedSpan };
            }
        }

        function updateUI() {
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                const current = Math.floor(state.resources[key].current + 1e-9);
                setText(ui.res[key], cfg.hasMax ? `${current}/${resMax(key)}` : `${current}`);
            }
            for (const action of ACTION_CONFIG) {
                const btn = ui.buttons[action.id];
                const disabled = !canAfford(action.cost);
                if (btn.disabled !== disabled) btn.disabled = disabled;
            }

            for (const action of ACTION_CONFIG) {
                setText(ui.rewardSpans[action.id], formatResMap(rewardOf(action), "+"));
            }

            // Shop
            const shopOpen = state.unlocked.length > 0;
            if (ui.shopCard.hidden === shopOpen) ui.shopCard.hidden = !shopOpen;
            for (const item of ITEM_CONFIG) {
                const el = ui.items[item.id];
                const visible = state.unlocked.includes(item.id);
                if (el.btn.hidden === visible) el.btn.hidden = !visible;
                if (!visible) continue;

                const maxed = isMaxed(item);
                setText(el.price, maxed ? "Im Besitz" : formatResMap(item.cost));
                setText(el.owned, `Besitz: ${ownedCount(item)}`);
                const disabled = maxed || !canAfford(item.cost);
                if (el.btn.disabled !== disabled) el.btn.disabled = disabled;
            }

            updateMenus();
        }

        // Gemeinsamer Button-Baustein für Loop, Training und Upgrades
        function createCardButton(name, onClick, rightClass) {
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.type = 'button';
            btn.addEventListener('click', onClick);

            const header = document.createElement('div');
            header.className = 'btn-header';
            const nameSpan = document.createElement('span');
            nameSpan.textContent = name;
            const right = document.createElement('span');
            right.className = rightClass;
            header.append(nameSpan, right);

            const desc = document.createElement('div');
            desc.className = 'btn-desc';
            const descText = document.createTextNode('');
            const extra = document.createElement('span');
            extra.className = 'btn-cost';
            desc.append(descText, extra);

            btn.append(header, desc);
            return { btn, right, desc: descText, extra };
        }

        function buildMenus() {
            ui.act = {};
            ui.up = {};
            ui.stats = [];

            const lists = {
                loop: document.getElementById('loop-list'),
                training: document.getElementById('training-list')
            };
            for (const a of ACTIVITY_CONFIG) {
                const c = createCardButton(a.name, () => toggleActivity(a.id), 'btn-reward');
                c.desc.textContent = a.desc;
                lists[a.tab].appendChild(c.btn);
                ui.act[a.id] = c;
            }

            const upList = document.getElementById('upgrade-list');
            for (const u of UPGRADE_CONFIG) {
                const c = createCardButton(u.name, () => buyUpgrade(u.id), 'btn-price');
                c.desc.textContent = u.desc;
                upList.appendChild(c.btn);
                ui.up[u.id] = c;
            }

            const statsList = document.getElementById('stats-list');
            for (const stat of STAT_CONFIG) {
                const row = document.createElement('div');
                row.className = 'stat-row';
                const label = document.createElement('span');
                label.textContent = stat.label;
                const value = document.createElement('span');
                row.append(label, value);
                statsList.appendChild(row);
                ui.stats.push(value);
            }
        }

        function updateMenus() {
            for (const a of ACTIVITY_CONFIG) {
                const c = ui.act[a.id];
                const running = isActive(a.id);
                setText(c.right, running ? "● Läuft" : "Start");
                setText(c.extra, a.info());
                c.btn.classList.toggle('running', running);
            }

            for (const u of UPGRADE_CONFIG) {
                const c = ui.up[u.id];
                const cost = upgradeCost(u);
                setText(c.right, formatResMap(cost));
                setText(c.extra, u.info());
                const disabled = !canAfford(cost);
                if (c.btn.disabled !== disabled) c.btn.disabled = disabled;
            }

            STAT_CONFIG.forEach((stat, i) => setText(ui.stats[i], stat.get()));
        }

        function showTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.id !== 'tab-' + name; });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        }

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.addEventListener('click', () => showTab(b.dataset.tab));
            });
            showTab('actions');
        }

        function updateClock() {
            document.getElementById('clock-display').textContent = new Date().toLocaleTimeString('de-DE');
        }

        function setStatus(text) {
            document.getElementById('save-status').textContent = text;
        }

        /* =================================================================
           5. SPEICHERN & LADEN
           ================================================================= */
        function saveGame() {
            tick();
            const payload = {
                version: SAVE_VERSION,
                lastSaved: Date.now(),
                resources: {},
                unlocked: [...state.unlocked],
                inventory: { ...state.inventory },
                upgrades: { ...state.upgrades },
                progress: JSON.parse(JSON.stringify(state.progress)),
                food: state.food
            };
            for (const key of Object.keys(RESOURCE_CONFIG)) {
                payload.resources[key] = { current: state.resources[key].current };
            }

            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
                storageOk = true;
                setStatus(`Zuletzt gespeichert: ${new Date().toLocaleTimeString('de-DE')}`);
            } catch (e) {
                storageOk = false;
                console.error("Speichern fehlgeschlagen:", e);
                setStatus("⚠ Speichern nicht möglich (Browser-Speicher gesperrt oder voll)");
            }
        }

        // Übernimmt nur validierte Werte; max kommt immer aus der aktuellen Konfiguration
        function applySave(parsed) {
            if (!parsed || typeof parsed !== 'object') return;

            for (const key of Object.keys(RESOURCE_CONFIG)) {
                const saved = parsed.resources && parsed.resources[key]
                    ? parsed.resources[key].current
                    : undefined;
                if (typeof saved === 'number' && Number.isFinite(saved)) {
                    state.resources[key].current = Math.max(0, saved); // Klemmen erst am Ende (Maxima hängen von Level/Items ab)
                }
            }

            // Shop: freigeschaltete Items und Inventar (nur bekannte IDs, nur gültige Zahlen)
            if (Array.isArray(parsed.unlocked)) {
                state.unlocked = ITEM_CONFIG
                    .map(i => i.id)
                    .filter(id => parsed.unlocked.includes(id));
            }
            if (parsed.inventory && typeof parsed.inventory === 'object') {
                for (const item of ITEM_CONFIG) {
                    const n = parsed.inventory[item.id];
                    if (Number.isInteger(n) && n > 0) {
                        state.inventory[item.id] = item.maxOwned != null ? Math.min(n, item.maxOwned) : n;
                    }
                }
            }

            // Upgrades & Trainingsfortschritt (nur bekannte IDs, nur gültige Zahlen)
            if (parsed.upgrades && typeof parsed.upgrades === 'object') {
                for (const u of UPGRADE_CONFIG) {
                    const n = parsed.upgrades[u.id];
                    if (Number.isInteger(n) && n > 0) state.upgrades[u.id] = n;
                }
            }
            if (parsed.progress && typeof parsed.progress === 'object') {
                for (const a of ACTIVITY_CONFIG) {
                    const q = parsed.progress[a.id];
                    if (a.xpPerLevel && q && Number.isInteger(q.level) && q.level >= 0
                        && Number.isFinite(q.xp) && q.xp >= 0) {
                        state.progress[a.id] = { level: q.level, xp: Math.min(q.xp, a.xpPerLevel) };
                    }
                }
            }

            if (Number.isInteger(parsed.food) && parsed.food >= 0) state.food = parsed.food;

            clampAll();

            // Offline-Fortschritt: Regeneration für die Zeit seit dem letzten Speichern
            if (typeof parsed.lastSaved === 'number' && Number.isFinite(parsed.lastSaved)) {
                regenerate(Math.max(0, (Date.now() - parsed.lastSaved) / 1000));
            }

            checkUnlocks();
        }

        function loadGame() {
            initDefaultState();

            let raw = null;
            try {
                raw = localStorage.getItem(SAVE_KEY);
            } catch (e) {
                storageOk = false;
                console.error("Speicher nicht lesbar:", e);
                setStatus("⚠ Speichern nicht möglich (Browser-Speicher gesperrt)");
                return;
            }
            if (!raw) return;

            try {
                applySave(JSON.parse(raw));
            } catch (e) {
                console.error("Speicherstand konnte nicht geladen werden:", e);
            }
        }

        /* =================================================================
           6. START
           ================================================================= */
        loadGame();
        lastTick = Date.now();
        buildUI();
        buildMenus();
        initTabs();
        updateUI();
        updateClock();

        setInterval(() => { tick(); updateUI(); }, 250); // Regeneration & Button-Status
        setInterval(updateClock, 1000);
        setInterval(saveGame, AUTOSAVE_MS);

        // Speichern, wenn der Tab verlassen oder im Hintergrund pausiert wird
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveGame();
            } else {
                tick();          // Zeit im Hintergrund nachrechnen
                updateUI();
            }
        });
        window.addEventListener('pagehide', saveGame);

        // Mehrere Tabs: Stand des zuletzt speichernden Tabs übernehmen
        window.addEventListener('storage', (e) => {
            if (e.key !== SAVE_KEY || !e.newValue) return;
            try {
                applySave(JSON.parse(e.newValue));
                lastTick = Date.now();
                updateUI();
            } catch (err) {
                console.error("Synchronisation fehlgeschlagen:", err);
            }
        });
    </script>
</body>
</html>

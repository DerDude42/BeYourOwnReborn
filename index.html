<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chronicle Minimal</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #4e89ae;
            --success: #4ea870;
            --text-main: #e1e1e6;
            --text-muted: #9a9aa2;
            --border: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- OBERE LEISTE: RESSOURCEN & UHR --- */
        header {
            background-color: var(--card-bg);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .res-group {
            display: flex;
            gap: 10px;
        }

        .res-box {
            background: #16161b;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .res-box span {
            color: var(--accent);
        }

        #clock-display {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums; /* Verhindert Wackeln der Zahlen */
            font-size: 0.95rem;
        }

        /* --- HAUPTBEREICH --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        /* --- BUTTONS --- */
        .action-btn {
            width: 100%;
            background-color: #272730;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            color: var(--text-main);
            text-align: left;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.06s, background-color 0.15s;
        }

        .action-btn:last-child {
            margin-bottom: 0;
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.97);
            background-color: #32323e;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .btn-reward {
            color: var(--success);
            font-size: 0.95rem;
        }

        .btn-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* --- DEZENTE STATUS-ZEILE UNTEN --- */
        footer {
            padding: 10px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="res-group" id="resource-bar"></div>
        <div id="clock-display">00:00:00</div>
    </header>

    <main>
        <section class="card" id="actions-container"></section>
    </main>

    <footer id="save-status">Autosave aktiv (alle 10 Sek.)</footer>

    <script>
        /* =================================================================
           1. KONFIGURATION (EINFACH ERWEITERBAR)
           ================================================================= */
        const RESOURCE_CONFIG = {
            energy: { name: "Energie", hasMax: true,  start: 10, max: 10 },
            money:  { name: "Geld",    hasMax: false, start: 0,  max: 0  }
        };

        const ACTION_CONFIG = [
            {
                id: "beg",
                name: "Betteln",
                desc: "Bitte Passanten um eine kleine Münze.",
                cost:   { energy: 2 },
                reward: { money: 1 }
            }
        ];

        /* =================================================================
           2. SPIELZUSTAND
           ================================================================= */
        const SAVE_KEY = "chronicle_minimal_v1";
        let state = { resources: {} };

        function initDefaultState() {
            state.resources = {};
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                state.resources[key] = {
                    current: cfg.start,
                    max: cfg.max
                };
            }
        }

        /* =================================================================
           3. SPIELLOGIK
           ================================================================= */
        function canAfford(costObj) {
            for (const [resKey, amount] of Object.entries(costObj)) {
                if (!state.resources[resKey] || state.resources[resKey].current < amount) {
                    return false;
                }
            }
            return true;
        }

        function executeAction(actionId) {
            const action = ACTION_CONFIG.find(a => a.id === actionId);
            if (!action || !canAfford(action.cost)) return;

            // Kosten abziehen
            for (const [resKey, amount] of Object.entries(action.cost)) {
                state.resources[resKey].current -= amount;
            }

            // Belohnung gutschreiben
            for (const [resKey, amount] of Object.entries(action.reward)) {
                const res = state.resources[resKey];
                const cfg = RESOURCE_CONFIG[resKey];
                res.current = cfg.hasMax ? Math.min(res.max, res.current + amount) : res.current + amount;
            }

            renderUI();
        }

        /* =================================================================
           4. UI & UHR
           ================================================================= */
        function formatResMap(resMap, prefix = "") {
            return Object.entries(resMap).map(([key, val]) => {
                const name = RESOURCE_CONFIG[key] ? RESOURCE_CONFIG[key].name : key;
                return `${prefix}${val} ${name}`;
            }).join(", ");
        }

        function renderUI() {
            // Ressourcen-Anzeige oben
            const resBar = document.getElementById('resource-bar');
            resBar.innerHTML = "";
            for (const [key, cfg] of Object.entries(RESOURCE_CONFIG)) {
                const resState = state.resources[key];
                const div = document.createElement('div');
                div.className = 'res-box';
                const maxText = cfg.hasMax ? `/${resState.max}` : "";
                div.innerHTML = `${cfg.name}: <span>${resState.current}${maxText}</span>`;
                resBar.appendChild(div);
            }

            // Aktions-Buttons
            const actContainer = document.getElementById('actions-container');
            actContainer.innerHTML = "";
            for (const action of ACTION_CONFIG) {
                const affordable = canAfford(action.cost);
                const costText = Object.keys(action.cost).length > 0 ? `Kosten: ${formatResMap(action.cost)}` : "Kostenlos";
                const rewardText = formatResMap(action.reward, "+");

                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.disabled = !affordable;
                btn.onclick = () => executeAction(action.id);
                btn.innerHTML = `
                    <div class="btn-header">
                        <span>${action.name}</span>
                        <span class="btn-reward">${rewardText}</span>
                    </div>
                    <div class="btn-desc">${action.desc}<br><strong>${costText}</strong></div>
                `;
                actContainer.appendChild(btn);
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').textContent = now.toLocaleTimeString('de-DE');
        }

        /* =================================================================
           5. SPEICHERN & LADEN (AUTOSAVE ALLE 10 SEKUNDEN)
           ================================================================= */
        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(state));
            const timeStr = new Date().toLocaleTimeString('de-DE');
            document.getElementById('save-status').textContent = `Zuletzt gespeichert: ${timeStr}`;
        }

        function loadGame() {
            initDefaultState();
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return;
            try {
                const parsed = JSON.parse(saved);
                for (const key of Object.keys(state.resources)) {
                    if (parsed.resources && parsed.resources[key]) {
Object.assign(state.resources[key], parsed.resources[key]);
}
}
} catch (e) {
console.error("Speicherstand konnte nicht geladen werden:", e);
}
}
// Start-Initialisierung
loadGame();
renderUI();
updateClock();
// Intervalle starten
setInterval(updateClock, 1000);   // Uhr jede Sekunde aktualisieren
setInterval(saveGame, 10000);     // Autosave alle 10 Sekunden (10.000 ms)

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chronicle Prototyp</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #4e89ae;
            --danger: #a84a4a;
            --text-main: #e1e1e6;
            --text-muted: #9a9aa2;
            --border: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- OBERE RESSOURCEN-LEISTE --- */
        header {
            background-color: var(--card-bg);
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .res-box span {
            color: var(--accent);
        }

        /* --- HAUPTBEREICH --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        h2 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- STORY LOG --- */
        #story-log {
            max-height: 130px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d0d0d8;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-highlight {
            color: var(--accent);
            font-weight: bold;
        }

        /* --- TOUCH-OPTIMIERTE BUTTONS --- */
        .action-btn {
            width: 100%;
            background-color: #272730;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            color: var(--text-main);
            text-align: left;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .action-btn:last-child {
            margin-bottom: 0;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:disabled {
            opacity: 0.45;
        }

        .danger-btn {
            background-color: rgba(168, 74, 74, 0.2);
            border-color: var(--danger);
            text-align: center;
            font-weight: bold;
        }

        .btn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }

        .btn-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            position: relative;
            z-index: 2;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: rgba(78, 137, 174, 0.35);
            width: 0%;
            z-index: 1;
            transition: width 0.1s linear;
        }

        /* --- UNTERE NAVIGATION --- */
        nav {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-shrink: 0;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .nav-btn.active {
            color: var(--accent);
            border-top: 3px solid var(--accent);
            background-color: rgba(78, 137, 174, 0.08);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="res-box">Energie: <span id="res-energy">10</span>/<span id="res-max-energy">10</span></div>
        <div class="res-box">Wissen: <span id="res-knowledge">0</span></div>
    </header>

    <main>
        <section class="card">
            <h2>Chronik</h2>
            <div id="story-log">
                <div>Du erwachst in einer dunklen Kammer. Dein Geist ist noch benebelt.</div>
            </div>
        </section>

        <!-- TAB 1: AKTIONEN -->
        <section id="tab-actions" class="card">
            <h2>Aktionen</h2>
            
            <button class="action-btn" id="btn-meditate" onclick="toggleAction('meditate')">
                <div class="progress-fill" id="prog-meditate"></div>
                <div class="btn-header">
                    <span>Meditieren</span>
                    <span>+1 Wissen</span>
                </div>
                <div class="btn-desc">Kostet 2 Energie | Dauer: 2 Sek.</div>
            </button>

            <button class="action-btn" id="btn-rest" onclick="toggleAction('rest')">
                <div class="progress-fill" id="prog-rest"></div>
                <div class="btn-header">
                    <span>Ausruhen</span>
                    <span>+5 Energie</span>
                </div>
                <div class="btn-desc">Regeneriert deine Kraft | Dauer: 3 Sek.</div>
            </button>
        </section>

        <!-- TAB 2: UPGRADES -->
        <section id="tab-upgrades" class="card hidden">
            <h2>Erkenntnisse</h2>
            
            <button class="action-btn" id="upg-mind" onclick="buyUpgrade('mind')">
                <div class="btn-header">
                    <span>Geist erweitern (Stufe <span id="lvl-mind">0</span>)</span>
                    <span id="cost-mind">5 Wissen</span>
                </div>
                <div class="btn-desc">Erhöht maximale Energie um +5</div>
            </button>
        </section>

        <!-- TAB 3: SYSTEM / SPEICHERN -->
        <section id="tab-system" class="card hidden">
            <h2>System</h2>
            <button class="action-btn" onclick="saveGame(true)">
                <div class="btn-header"><span>Spielstand manuell speichern</span></div>
                <div class="btn-desc" id="save-status">Speichert automatisch alle 5 Sekunden</div>
            </button>

            <button class="action-btn danger-btn" onclick="resetGame()">
                Spielstand komplett zurücksetzen
            </button>
        </section>
    </main>

    <nav>
        <button class="nav-btn active" id="nav-actions" onclick="switchTab('actions')">Aktionen</button>
        <button class="nav-btn" id="nav-upgrades" onclick="switchTab('upgrades')">Upgrades</button>
        <button class="nav-btn" id="nav-system" onclick="switchTab('system')">System</button>
    </nav>

    <script>
        const SAVE_KEY = "chronicle_proto_save_v1";

        // Standardwerte für ein neues Spiel
        const defaultGame = {
            energy: 10,
            maxEnergy: 10,
            knowledge: 0,
            activeAction: null,
            progress: 0,
            lastSaved: Date.now(),
            storyFlags: { firstKnowledge: false },
            upgrades: { mind: { level: 0, cost: 5 } }
        };

        let game = JSON.parse(JSON.stringify(defaultGame));

        const actions = {
            meditate: { duration: 2.0, energyCost: 2 },
            rest: { duration: 3.0, energyCost: 0 }
        };

        /* --- SPEICHERN, LADEN & OFFLINE-FORTSCHRITT --- */
        function saveGame(manual = false) {
            game.lastSaved = Date.now();
            localStorage.setItem(SAVE_KEY, JSON.stringify(game));
            if (manual) {
                document.getElementById('save-status').textContent = "Gespeichert um " + new Date().toLocaleTimeString();
            }
        }

        function loadGame() {
            const savedData = localStorage.getItem(SAVE_KEY);
            if (!savedData) return;

            try {
                const parsed = JSON.parse(savedData);
                // Führt gespeicherte Werte sicher mit Standardwerten zusammen
                game = {
                    ...defaultGame,
                    ...parsed,
                    storyFlags: { ...defaultGame.storyFlags, ...(parsed.storyFlags || {}) },
                    upgrades: { ...defaultGame.upgrades, ...(parsed.upgrades || {}) }
                };

                calculateOfflineProgress();
            } catch (e) {
                console.error("Fehler beim Laden des Spielstands:", e);
            }
        }

        function calculateOfflineProgress() {
            const now = Date.now();
            const secondsPassed = Math.floor((now - game.lastSaved) / 1000);

            if (secondsPassed > 2 && game.activeAction) {
                const actId = game.activeAction;
                const act = actions[actId];
                // Maximal 24 Stunden (86400 Sek.) Offline-Fortschritt berechnen
const effectiveSeconds = Math.min(secondsPassed, 86400);
const possibleCompletions = Math.floor(effectiveSeconds / act.duration);
let completedCount = 0;
for (let i = 0; i < possibleCompletions; i++) {
if (canStartAction(actId)) {
completeAction(actId);
completedCount++;
} else {
game.activeAction = null;
game.progress = 0;
break;
}
}
if (completedCount > 0) {
addStoryLog(Während deiner Abwesenheit (${secondsPassed} Sek.) wurde "${actId}" ${completedCount}x ausgeführt., true);
}
}
}
function resetGame() {
if (confirm("Möchtest du deinen Spielstand wirklich unwiderruflich löschen?")) {
localStorage.removeItem(SAVE_KEY);
location.reload();
}
}
/* --- SPIELSCHLEIFE --- */
const TICK_RATE = 100;
setInterval(() => {
if (game.activeAction) {
const act = actions[game.activeAction];
game.progress += (TICK_RATE / 1000) / act.duration;
if (game.progress >= 1) {
completeAction(game.activeAction);
game.progress = 0;
if (!canStartAction(game.activeAction)) {
game.activeAction = null;
}
}
}
updateUI();
}, TICK_RATE);
// Automatisches Speichern alle 5 Sekunden
setInterval(() => saveGame(false), 5000);
/* --- SPIELLOGIK --- */
function canStartAction(actionId) {
if (actionId === 'meditate') return game.energy >= actions.meditate.energyCost;
if (actionId === 'rest') return game.energy < game.maxEnergy;
return false;
}
function toggleAction(actionId) {
if (game.activeAction === actionId) {
game.activeAction = null;
game.progress = 0;
} else if (canStartAction(actionId)) {
game.activeAction = actionId;
game.progress = 0;
}
saveGame(false);
updateUI();
}
function completeAction(actionId) {
if (actionId === 'meditate') {
game.energy -= actions.meditate.energyCost;
game.knowledge += 1;
checkStoryEvents();
} else if (actionId === 'rest') {
game.energy = Math.min(game.maxEnergy, game.energy + 5);
}
}
function buyUpgrade(upgId) {
const upg = game.upgrades[upgId];
if (game.knowledge >= upg.cost) {
game.knowledge -= upg.cost;
upg.level += 1;
upg.cost = Math.floor(upg.cost * 1.5);
if (upgId === 'mind') {
game.maxEnergy += 5;
addStoryLog("Dein Geist fühlt sich klarer an. Du kannst nun mehr Energie speichern.");
}
saveGame(false);
updateUI();
}
}
function checkStoryEvents() {
if (game.knowledge >= 1 && !game.storyFlags.firstKnowledge) {
game.storyFlags.firstKnowledge = true;
addStoryLog("Ein erster Funke der Erinnerung kehrt zurück. Du beginnst zu verstehen.");
}
}
function addStoryLog(text, highlight = false) {
const log = document.getElementById('story-log');
const entry = document.createElement('div');
entry.textContent = "> " + text;
if (highlight) entry.classList.add('log-highlight');
log.prepend(entry);
}
/* --- UI & TABS --- */
function updateUI() {
document.getElementById('res-energy').textContent = game.energy;
document.getElementById('res-max-energy').textContent = game.maxEnergy;
document.getElementById('res-knowledge').textContent = game.knowledge;
document.getElementById('prog-meditate').style.width =
(game.activeAction === 'meditate' ? game.progress * 100 : 0) + '%';
document.getElementById('prog-rest').style.width =
(game.activeAction === 'rest' ? game.progress * 100 : 0) + '%';
document.getElementById('btn-meditate').disabled = !canStartAction('meditate') && game.activeAction !== 'meditate';
document.getElementById('btn-rest').disabled = !canStartAction('rest') && game.activeAction !== 'rest';
const mind = game.upgrades.mind;
document.getElementById('lvl-mind').textContent = mind.level;
document.getElementById('cost-mind').textContent = mind.cost + " Wissen";
document.getElementById('upg-mind').disabled = game.knowledge < mind.cost;
}
function switchTab(tabName) {
['actions', 'upgrades', 'system'].forEach(t => {
document.getElementById('tab-' + t).classList.add('hidden');
document.getElementById('nav-' + t).classList.remove('active');
});
document.getElementById('tab-' + tabName).classList.remove('hidden');
document.getElementById('nav-' + tabName).classList.add('active');
}
// Spiel beim Start laden und UI aktualisieren
loadGame();
updateUI();
